name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# GitHub Actions 배포에 필요한 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 제어 (이전 배포 취소)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Set up Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies 🔧
        run: npm install

      - name: Build 🏗️
        run: npm run build

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite 빌드 결과물 경로

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
